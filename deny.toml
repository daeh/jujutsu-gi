# cargo-deny configuration. Run with `task deny` or `cargo deny check`.
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[licenses]
version = 2
# Allow the standard Rust-ecosystem licenses. Unicode-3.0 is required for
# unicode-ident (its license is `(MIT OR Apache-2.0) AND Unicode-3.0`).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# There are currently no git dependencies. Add new git dependencies here
# when introduced (with a comment naming the dep + reason).
allow-git = []
