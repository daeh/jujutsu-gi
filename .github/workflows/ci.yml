name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build + lint + test + deny
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cache restore BEFORE the `cargo install` steps so cold-run installs
      # of cargo-deny / cargo-machete are pulled from the cargo registry
      # cache instead of being re-downloaded every CI run.
      - name: Cache cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install jj
        run: brew install jj

      - name: Install go-task
        run: brew install go-task

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Install cargo-machete
        run: cargo install --locked cargo-machete

      - name: Build
        run: cargo build --release --locked

      - name: Lint (clippy + fmt-check)
        run: task lint

      - name: Test
        run: task test

      - name: Supply-chain audit (cargo-deny)
        run: cargo deny check

      - name: Unused-dependency check (cargo-machete)
        run: cargo machete
